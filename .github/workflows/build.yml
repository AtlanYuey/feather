name: Build

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      - name: Prepare dependencies (Xcode)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.0.app

      - name: Resolve Swift packages
        run: |
          for i in 1 2 3; do
            xcodebuild -resolvePackageDependencies -project Feather.xcodeproj -scheme Feather \
              -derivedDataPath "$TMPDIR/Feather/iphoneos" -skipPackagePluginValidation && break
            echo "Package resolution failed (attempt $i), retrying..."
            sleep 5
          done

      - name: Build (iOS)
        run: |
          agvtool new-version -all $(git rev-parse HEAD)
          for i in 1 2 3; do
            make iphoneos && exit 0
            echo "Build failed (attempt $i), retrying..."
            sleep 5
          done
          exit 1

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Feather-${{ github.sha }}
          path: packages/*
          if-no-files-found: error
